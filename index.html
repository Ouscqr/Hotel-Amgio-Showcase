<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <!--
      The runtime title is set from the VITE_HOTEL_NAME environment variable
      (see src/config/site.ts). The values below are the neutral fallback used
      before the bundle boots and by crawlers.
    -->
    <title>City Hotel Amsterdam | Direct Booking</title>
    <meta
      name="description"
      content="Portfolio demo of a responsive hotel marketing site with date-based booking deep links, five locales and dark mode."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.webp" />
    <meta property="og:title" content="City Hotel Amsterdam | Direct Booking" />
    <meta
      property="og:description"
      content="Portfolio demo of a responsive hotel marketing site with date-based booking deep links, five locales and dark mode."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="City Hotel Amsterdam | Direct Booking" />
    <meta
      name="twitter:description"
      content="Portfolio demo of a responsive hotel marketing site with date-based booking deep links, five locales and dark mode."
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
